# The AAuth sandbox, the Petstore as an AAuth resource behind it, and a
# Newman run of the collection against them.
#
# Two parts, so each can be run and studied on its own:
#
#   1. The sandbox from aauth-go: agent provider, person server, access
#      server and its demo resources. Needs only an aauth-go checkout.
#        docker compose up -d --wait
#        docker compose --profile test run --rm newman           # the AAuth collection
#   2. The Petstore as a resource server of its own, behind the sandbox.
#      Needs a petstore checkout too.
#        docker compose --profile petstore up -d --wait
#        docker compose --profile petstore run --rm newman-petstore  # the Petstore collection
#        docker compose --profile petstore run --rm omniagent    # chat with omniagent as the agent
#
# The sandbox serves the agent provider, person server, access server and
# its demo resources, and fronts the Petstore at https://petstore.aauth.test.
# Until the images are published, they are built from sibling checkouts in
# the layout ~/go/src/github.com/<org>/<repo>: aauth-go (AAUTH_GO_DIR, default
# ../../aauth-dev/aauth-go), and for part 2 petstore (PETSTORE_DIR, default
# ../../grokify/petstore) and omniagent (OMNIAGENT_DIR, default
# ../../plexusone/omniagent).

name: aauth-postman

services:
  sandbox:
    image: aauth-sandbox:dev
    build:
      context: ${AAUTH_GO_DIR:-../../aauth-dev/aauth-go}
      dockerfile: deploy/docker/Dockerfile
    ports:
      # The signing helper Postman sends requests through, and the roles
      # themselves for a browser. Loopback only: the helper signs anything.
      - "127.0.0.1:${SIGNER_PORT:-8099}:8099"
      - "127.0.0.1:${SANDBOX_HTTPS_PORT:-443}:443"
    # Replaces the image's command, so it repeats the listen options. The
    # roles and the helper listen on every interface inside the container
    # (the ports above publish them on the host's loopback only), and the
    # helper answers Newman, which calls it as "sandbox".
    command: ["serve", "--state", "/state",
              "--listen", "0.0.0.0:443", "--listen-any-interface",
              "--signer", "0.0.0.0:8099", "--signer-any-interface", "--signer-host", "sandbox",
              "--upstream", "petstore=http://petstore:8080"]
    volumes:
      - state:/state
    networks:
      default:
        # Containers reach every role, and the Petstore, by its identifier.
        aliases: [ap.aauth.test, ps.aauth.test, as.aauth.test, resource.aauth.test, docs.aauth.test, petstore.aauth.test]
    healthcheck:
      test: ["CMD", "aauth-sandbox", "health", "--state", "/state", "--signer", "127.0.0.1:8099"]
      interval: 2s
      timeout: 5s
      retries: 30

  petstore:
    image: petstore-server:dev
    profiles: [petstore]
    # The Petstore creates a new signing key at each start, and the sandbox's
    # person server keeps the key it saw: recreate the sandbox with it.
    build:
      context: ${PETSTORE_DIR:-../../grokify/petstore}
    command: ["--listen", ":8080", "--auth", "aauth",
              "--url", "https://petstore.aauth.test",
              "--trust", "https://ps.aauth.test",
              "--ca-file", "/state/ca.pem"]
    volumes:
      - state:/state:ro
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/petstore-server", "health", "--addr", "127.0.0.1:8080"]
      interval: 2s
      timeout: 5s
      retries: 30

  newman:
    image: postman/newman:6.1.3-alpine
    profiles: [test]
    depends_on:
      sandbox:
        condition: service_healthy
    working_dir: /etc/newman
    volumes:
      - ./collections:/etc/newman/collections:ro
      - ./environments:/etc/newman/environments:ro
    command:
      - run
      - collections/aauth.postman_collection.json
      - --environment
      - environments/sandbox.postman_environment.json
      - --env-var
      - signer_url=http://sandbox:8099

  newman-petstore:
    image: postman/newman:6.1.3-alpine
    profiles: [petstore-test]
    depends_on:
      petstore:
        condition: service_healthy
    working_dir: /etc/newman
    volumes:
      - ./collections:/etc/newman/collections:ro
      - ./environments:/etc/newman/environments:ro
    command:
      - run
      - collections/petstore.postman_collection.json
      - --environment
      - environments/petstore.postman_environment.json
      - --env-var
      - signer_url=http://sandbox:8099

  omniagent:
    image: aauth-petstore:dev
    build:
      context: ${OMNIAGENT_DIR:-../../plexusone/omniagent}
      dockerfile: examples/aauth-petstore/Dockerfile
    profiles: [omniagent]
    depends_on:
      petstore:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - state:/state:ro
    environment:
      AAUTH_CA_FILE: /state/ca.pem
      # The model: omniagent's settings, passed through from your shell.
      OMNIAGENT_AGENT_PROVIDER: ${OMNIAGENT_AGENT_PROVIDER:-anthropic}
      OMNIAGENT_AGENT_MODEL: ${OMNIAGENT_AGENT_MODEL:-}
      OMNIAGENT_AGENT_BASE_URL: ${OMNIAGENT_AGENT_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  state:
