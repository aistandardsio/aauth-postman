# The AAuth sandbox, the Petstore as an AAuth resource behind it, and a
# Newman run of the collection against them.
#
#   docker compose up -d --wait                    # start the sandbox and the Petstore
#   docker compose --profile test run --rm newman  # run every folder
#   docker compose run --rm omniagent              # chat with omniagent as the agent
#
# The sandbox serves the agent provider, person server, access server and
# its demo resources, and fronts the Petstore at https://petstore.aauth.test.
# Until the images are published, they are built from sibling checkouts:
# aauth-go (AAUTH_GO_DIR, default ../aauth-go), petstore (PETSTORE_DIR,
# default ../../grokify/petstore) and omniagent (OMNIAGENT_DIR, default
# ../../plexusone/omniagent).

name: aauth-postman

services:
  sandbox:
    image: aauth-sandbox:dev
    build:
      context: ${AAUTH_GO_DIR:-../aauth-go}
      dockerfile: deploy/docker/Dockerfile
    ports:
      # The signing helper Postman sends requests through, and the roles
      # themselves for a browser. Loopback only: the helper signs anything.
      - "127.0.0.1:${SIGNER_PORT:-8099}:8099"
      - "127.0.0.1:${SANDBOX_HTTPS_PORT:-443}:443"
    command: ["serve", "--state", "/state", "--signer", "0.0.0.0:8099", "--signer-any-interface",
              "--upstream", "petstore=http://petstore:8080"]
    volumes:
      - state:/state
    networks:
      default:
        # Containers reach every role, and the Petstore, by its identifier.
        aliases: [ap.aauth.test, ps.aauth.test, as.aauth.test, resource.aauth.test, docs.aauth.test, petstore.aauth.test]
    healthcheck:
      test: ["CMD", "aauth-sandbox", "health", "--state", "/state", "--signer", "127.0.0.1:8099"]
      interval: 2s
      timeout: 5s
      retries: 30

  petstore:
    image: petstore-server:dev
    build:
      context: ${PETSTORE_DIR:-../../grokify/petstore}
      additional_contexts:
        aauth-go: ${AAUTH_GO_DIR:-../aauth-go}
    command: ["--listen", ":8080", "--auth", "aauth",
              "--url", "https://petstore.aauth.test",
              "--trust", "https://ps.aauth.test",
              "--ca-file", "/state/ca.pem"]
    volumes:
      - state:/state:ro
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/petstore-server", "health", "--addr", "127.0.0.1:8080"]
      interval: 2s
      timeout: 5s
      retries: 30

  newman:
    image: postman/newman:6.1.3-alpine
    profiles: [test]
    depends_on:
      sandbox:
        condition: service_healthy
      petstore:
        condition: service_healthy
    working_dir: /etc/newman
    volumes:
      - ./collections:/etc/newman/collections:ro
      - ./environments:/etc/newman/environments:ro
    command:
      - run
      - collections/aauth.postman_collection.json
      - --environment
      - environments/sandbox.postman_environment.json
      - --env-var
      - signer_url=http://sandbox:8099

  omniagent:
    image: aauth-petstore:dev
    build:
      context: ${OMNIAGENT_DIR:-../../plexusone/omniagent}
      dockerfile: examples/aauth-petstore/Dockerfile
      additional_contexts:
        aauth-go: ${AAUTH_GO_DIR:-../aauth-go}
    profiles: [omniagent]
    depends_on:
      petstore:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - state:/state:ro
    environment:
      AAUTH_CA_FILE: /state/ca.pem
      # The model: omniagent's settings, passed through from your shell.
      OMNIAGENT_AGENT_PROVIDER: ${OMNIAGENT_AGENT_PROVIDER:-anthropic}
      OMNIAGENT_AGENT_MODEL: ${OMNIAGENT_AGENT_MODEL:-}
      OMNIAGENT_AGENT_BASE_URL: ${OMNIAGENT_AGENT_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  state:
