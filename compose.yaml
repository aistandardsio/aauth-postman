# The AAuth sandbox and a Newman run of the collection against it.
#
#   docker compose up -d --wait                  # start the sandbox
#   docker compose --profile test run --rm newman  # run every folder
#
# Until the sandbox image is published, it is built from a sibling
# aauth-go checkout (AAUTH_GO_DIR, default ../aauth-go).

name: aauth-postman

services:
  sandbox:
    image: aauth-sandbox:dev
    build:
      context: ${AAUTH_GO_DIR:-../aauth-go}
      dockerfile: deploy/docker/Dockerfile
    ports:
      # The signing helper Postman sends requests through, and the roles
      # themselves for a browser. Loopback only: the helper signs anything.
      - "127.0.0.1:${SIGNER_PORT:-8099}:8099"
      - "127.0.0.1:${SANDBOX_HTTPS_PORT:-443}:443"
    volumes:
      - state:/state
    healthcheck:
      test: ["CMD", "aauth-sandbox", "health", "--state", "/state", "--signer", "127.0.0.1:8099"]
      interval: 2s
      timeout: 5s
      retries: 30

  newman:
    image: postman/newman:6.1.3-alpine
    profiles: [test]
    depends_on:
      sandbox:
        condition: service_healthy
    working_dir: /etc/newman
    volumes:
      - ./collections:/etc/newman/collections:ro
      - ./environments:/etc/newman/environments:ro
    command:
      - run
      - collections/aauth.postman_collection.json
      - --environment
      - environments/sandbox.postman_environment.json
      - --env-var
      - signer_url=http://sandbox:8099

volumes:
  state:
