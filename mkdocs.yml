site_name: aauth-postman
site_description: Postman collections for AAuth, generated from the protocol document, with a sandbox to run them against
site_url: https://aistandards.io/aauth-postman/
repo_url: https://github.com/aistandardsio/aauth-postman
repo_name: aistandardsio/aauth-postman

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (AIStandards.io default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://aistandards.io/css/aistandardsio-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Running Against the Sandbox: guides/setup.md
    - The Petstore Demos: guides/petstore.md
    - Interop Testing: guides/interop.md
  - Releases:
    - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aistandardsio/aauth-postman

plugins:
  - search
